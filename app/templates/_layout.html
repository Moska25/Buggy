<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ project_name }}{% endblock %} · {{ project_name }}</title>
<link rel="stylesheet" href="/static/app.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/">
    <span class="brand-mark"></span>
    <span class="brand-name">{{ project_name }}</span>
    <span class="brand-sub">{{ project_tagline }}</span>
  </a>
  <nav class="mainnav">
    {% for href, label in nav %}
    <a href="{{ href }}"{{ ' aria-current="page"' | safe if active == href }}>{{ label }}</a>
    {% endfor %}
  </nav>
</div></header>

<main>{% block content %}{% endblock %}</main>

<footer class="footer"><div class="footer-inner">
  <span style="font-family: var(--font-heading); font-size: 18px;">{{ project_name }}</span>
  <span style="flex: 1;"></span>
  <span class="muted" style="font-size: 13.5px;">{{ footer_note }}</span>
</div></footer>

<script src="/static/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
